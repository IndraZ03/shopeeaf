<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Data Produk - Lilyshop</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* Reusing some styles from index.html for matching aesthetic */
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #fff0f5;
            background-image: 
                linear-gradient(135deg, rgba(255, 255, 255, 0.7) 0%, rgba(255, 228, 225, 0.6) 50%, rgba(253, 245, 230, 0.7) 100%),
                url('https://images.unsplash.com/photo-1577085705353-834f31c778fa?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
        }

        .font-serif {
            font-family: 'Playfair Display', serif;
        }

        .glass {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 8px 32px 0 rgba(255, 182, 193, 0.2);
        }

        input, select {
            transition: all 0.3s ease;
        }
        input:focus, select:focus {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -10px rgba(255, 105, 180, 0.3);
        }
    </style>
</head>
<body class="text-gray-800 py-6 md:py-10 px-4">

    <div class="max-w-2xl mx-auto glass rounded-[20px] md:rounded-[30px] p-6 sm:p-8 md:p-10 relative overflow-hidden">
        <!-- Decoration -->
        <div class="absolute -top-10 -right-10 w-24 h-24 md:w-32 md:h-32 bg-pink-200 rounded-full blur-2xl opacity-50"></div>
        <div class="absolute -bottom-10 -left-10 w-24 h-24 md:w-32 md:h-32 bg-pink-300 rounded-full blur-2xl opacity-50"></div>
        
        <div class="relative z-10">
            <div class="text-center mb-8 md:mb-10">
                <h1 class="font-serif text-2xl md:text-3xl font-bold text-pink-600 mb-2">Tambah Produk</h1>
                <p class="text-gray-500 text-xs md:text-sm">Masukkan data produk baru untuk showcase Lilyshop.</p>
            </div>

            <form id="productForm" class="space-y-6">
                <!-- Judul Produk -->
                <div>
                    <label class="block text-sm font-medium text-pink-500 mb-2">Judul Produk</label>
                    <input type="text" id="title" required placeholder="Contoh: Dress Balet Estetik" class="w-full px-5 py-3 rounded-xl border border-pink-100 bg-white/80 focus:outline-none focus:border-pink-400 text-gray-700 placeholder-gray-400">
                </div>

                <!-- Kategori -->
                <div>
                    <label class="block text-sm font-medium text-pink-500 mb-2">Kategori</label>
                    <select id="category" class="w-full px-5 py-3 rounded-xl border border-pink-100 bg-white/80 focus:outline-none focus:border-pink-400 text-gray-700">
                        <option value="Fashion">Fashion</option>
                        <option value="Kecantikan">Kecantikan</option>
                        <option value="Dekorasi">Dekorasi</option>
                        <option value="Aksesoris">Aksesoris</option>
                    </select>
                </div>

                <!-- Link Shopee -->
                <div>
                    <label class="block text-sm font-medium text-pink-500 mb-2">Link Shopee</label>
                    <input type="url" id="link" required placeholder="https://shopee.co.id/..." class="w-full px-5 py-3 rounded-xl border border-pink-100 bg-white/80 focus:outline-none focus:border-pink-400 text-gray-700 placeholder-gray-400">
                </div>

                <!-- Upload Gambar -->
                <div>
                    <label class="block text-sm font-medium text-pink-500 mb-2">Upload Gambar Produk</label>
                    <div class="relative border-2 border-dashed border-pink-200 rounded-xl p-6 text-center hover:bg-pink-50/50 transition-colors">
                        <input type="file" id="image" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" required>
                        <i data-lucide="image-plus" class="w-10 h-10 text-pink-300 mx-auto mb-2"></i>
                        <p class="text-sm text-gray-500">Klik atau seret gambar ke sini</p>
                        <div id="previewContainer" class="hidden mt-4">
                            <img id="imagePreview" src="" alt="Preview" class="w-32 h-32 object-cover rounded-lg mx-auto shadow-md border border-pink-100">
                        </div>
                    </div>
                </div>

                <!-- Buttons -->
                <div class="pt-4 flex flex-col md:flex-row gap-3 md:gap-4">
                    <button type="submit" class="flex-1 bg-gradient-to-r from-pink-400 to-pink-500 text-white font-medium py-3 rounded-xl shadow-lg shadow-pink-200 hover:shadow-pink-300 hover:scale-[1.02] transition-all flex justify-center items-center gap-2 text-sm md:text-base">
                        <i data-lucide="plus-circle" class="w-4 h-4 md:w-5 md:h-5"></i> Simpan Produk
                    </button>
                    <button type="button" id="downloadBtn" class="flex-1 bg-white text-pink-500 font-medium py-3 rounded-xl border border-pink-200 shadow-sm hover:bg-pink-50 transition-all flex justify-center items-center gap-2 text-sm md:text-base">
                        <i data-lucide="download" class="w-4 h-4 md:w-5 md:h-5"></i> Unduh database.json
                    </button>
                </div>
                
                <div class="text-center mt-4 pt-4 border-t border-pink-100/50">
                    <a href="index.html" class="text-xs md:text-sm text-pink-400 hover:text-pink-600 underline font-medium">Kembali ke Halaman Utama</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-5 right-5 transform translate-y-20 opacity-0 transition-all duration-300 bg-white border-l-4 border-green-400 shadow-lg rounded-r-lg p-4 flex items-center gap-3 z-50">
        <i data-lucide="check-circle-2" class="text-green-500 w-6 h-6"></i>
        <div>
            <h4 class="font-bold text-gray-800 text-sm">Berhasil</h4>
            <p class="text-sm text-gray-600" id="toastMessage">Data tersimpan.</p>
        </div>
    </div>

    <script>
        lucide.createIcons();
        
        let currentBase64 = '';
        let products = [];

        // Inisialisasi data dari localStorage atau database.json
        async function initData() {
            const localData = localStorage.getItem('lilyshop_db');
            if (localData) {
                products = JSON.parse(localData);
            } else {
                try {
                    const res = await fetch('database.json');
                    if (res.ok) {
                        products = await res.json();
                        localStorage.setItem('lilyshop_db', JSON.stringify(products));
                    }
                } catch (e) {
                    console.log("Belum ada data database.json atau gagal di-load.");
                }
            }
        }
        initData();

        // Image Preview & Base64 Conversion
        document.getElementById('image').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    currentBase64 = event.target.result;
                    document.getElementById('imagePreview').src = currentBase64;
                    document.getElementById('previewContainer').classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        });

        // Simpan Form
        document.getElementById('productForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const title = document.getElementById('title').value;
            const category = document.getElementById('category').value;
            const link = document.getElementById('link').value;

            // Pastikan ada gambar yang di-upload
            if (!currentBase64) {
                alert("Mohon upload gambar produk terlebih dahulu!");
                return;
            }

            const newProduct = {
                id: Date.now(),
                title: title,
                image: currentBase64,
                link: link,
                category: category
            };

            products.push(newProduct);
            localStorage.setItem('lilyshop_db', JSON.stringify(products));

            // Show Toast Notification
            document.getElementById('toastMessage').innerText = "Produk berhasil ditambahkan ke sistem memori!";
            const toast = document.getElementById('toast');
            toast.classList.remove('translate-y-20', 'opacity-0');
            
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);

            // Reset Form State
            this.reset();
            currentBase64 = '';
            document.getElementById('previewContainer').classList.add('hidden');
        });

        // Download database.json
        document.getElementById('downloadBtn').addEventListener('click', function() {
            if (products.length === 0) {
                alert("Belum ada produk yang disimpan. Silakan tambahkan produk terlebih dahulu.");
                return;
            }
            
            const blob = new Blob([JSON.stringify(products, null, 4)], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = "database.json";
            document.body.appendChild(a);
            a.click();
            
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });
    </script>
</body>
</html>
